<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Printable Ruler</title>
  <style>
    :root {
      --scale: 1;
    }
    body {
      margin: 0;
      padding: 0.5in; /* keep some margin for printer */
    }
    #controls {
      position: fixed;
      top: 0.2in;
      right: 0.2in;
      background: rgba(255,255,255,0.8);
      padding: 0.2em;
      font-family: sans-serif;
      z-index: 10;
      border: 1px solid #ccc;
    }
    svg {
      display: block;
      transform-origin: 0 0;
      transform: scale(var(--scale));
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="scaleInput">Scale:</label>
    <input type="number" id="scaleInput" value="1" step="0.001" style="width:4em;">
    <span>(adjust to calibrate)</span>
  </div>

  <svg viewBox="0 0 1152 192" width="12in" height="2in" xmlns="http://www.w3.org/2000/svg">
    <!-- inch ticks -->
    <g id="inches" stroke="black" stroke-width="1"/>
    <!-- cm ticks -->
    <g id="cm" stroke="black" stroke-width="1"/>
  </svg>

  <script>
    (function() {
      const svg = document.querySelector('svg');
      const ns = svg.namespaceURI;

      // Draw inch ruler (top half)
      const inchGroup = document.getElementById('inches');
      const pxPerInch = 96;  // CSS defines 1in = 96px
      for (let i = 0; i <= 12 * 16; i++) {
        const x = i * (pxPerInch / 16);
        let h;
        if      (i % 16 === 0) h = 96;
        else if (i % 8  === 0) h = 64;
        else if (i % 4  === 0) h = 48;
        else if (i % 2  === 0) h = 32;
        else                   h = 16;
        // tick line
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', 0);
        line.setAttribute('x2', x);
        line.setAttribute('y2', h);
        inchGroup.appendChild(line);
        // label inches
        if (i % 16 === 0 && i > 0) {
          const num = i / 16;
          const text = document.createElementNS(ns, 'text');
          text.setAttribute('x', x + 2);
          text.setAttribute('y', h + 12);
          text.setAttribute('font-size', 12);
          text.setAttribute('font-family', 'sans-serif');
          text.textContent = num;
          inchGroup.appendChild(text);
        }
      }

      // Draw cm ruler (bottom half)
      const cmGroup = document.getElementById('cm');
      const pxPerMm = 96 / 25.4;          // px per millimeter
      const maxMm = Math.round(12 * 25.4); // how many mm in 12 inches (~304.8)
      for (let i = 0; i <= maxMm; i++) {
        const x = i * pxPerMm;
        let h = (i % 10 === 0) ? 96
              : (i % 5  === 0) ? 64
              :                    32;
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', 192);
        line.setAttribute('x2', x);
        line.setAttribute('y2', 192 - h);
        cmGroup.appendChild(line);
        // label cm
        if (i % 10 === 0 && i > 0) {
          const cmNum = i / 10;
          const text = document.createElementNS(ns, 'text');
          text.setAttribute('x', x + 2);
          text.setAttribute('y', 190);
          text.setAttribute('font-size', 12);
          text.setAttribute('font-family', 'sans-serif');
          text.textContent = cmNum;
          cmGroup.appendChild(text);
        }
      }
    })();

    // handle scale input
    document.getElementById('scaleInput').addEventListener('input', function() {
      document.documentElement.style.setProperty('--scale', this.value);
    });
  </script>
</body>
</html>
