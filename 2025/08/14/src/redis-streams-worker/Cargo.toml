[package]
name = "redis-streams-worker"
version = "0.1.0"
edition = "2021"
description = "Library for building Redis Streams workers"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dirs = "5.0"
redis = { version = "0.28.2", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
