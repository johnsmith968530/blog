[package]
name = "stardate-rs-worker"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.8"
redis = { version = "0.28.2", features = ["tokio-comp"] }
redis-streams-worker = { path = "../redis-streams-worker" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
